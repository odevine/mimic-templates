name: index

# Rebuild index.json from the .mimic assets on the repo's releases. The
# release-please workflow already reindexes after an automated release, so this
# is the manual path: it is dispatched by the Makefile's release target after a
# local upload, and can be run by hand to reconcile the catalog with the assets.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: index
  cancel-in-progress: false

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.MIMIC_RELEASE_PLEASE_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum

      - name: Rebuild index.json
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: go run ./tools/reindex -o index.json

      - name: Commit index.json
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.json
          git commit -m "chore: reindex templates" || exit 0
          git push origin main
