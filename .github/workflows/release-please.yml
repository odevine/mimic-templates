name: release-please

# release-please watches main for conventional commits and keeps one release
# pull request open per template. Merging that pull request updates the version in
# the template's template.json, creates its tag, and an empty GitHub Release. The
# bundle job then packs the template from its folder with the engine's pack
# command, uploads the bundle to that release, and rebuilds index.json.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# Serialize release runs so the index.json commit from one cannot race another
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      # A personal access token rather than GITHUB_TOKEN, so the release pull
      # request and the tag it pushes still trigger CI
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.MIMIC_RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  bundle:
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.MIMIC_RELEASE_PLEASE_TOKEN }}

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      # CI on the release commit runs alongside this job rather than gating it, so
      # the tools are checked here before a bundle they build is published
      - name: Vet and test
        run: |
          go vet ./...
          go test ./...

      - name: Pack and upload each released template
        env:
          GH_TOKEN: ${{ github.token }}
          PATHS: ${{ needs.release-please.outputs.paths_released }}
          # The engine release whose pack command builds a template
          ENGINE_VERSION: v0.19.0
        run: |
          mkdir -p build
          for path in $(echo "$PATHS" | jq -r '.[]'); do
            name="${path#templates/}"
            version="$(jq -r .version "templates/$name/template.json")"
            echo "packing $name/v$version"
            go run "github.com/odevine/mimic/engine/cmd/pack@$ENGINE_VERSION" "templates/$name" -o "build/$name.mimic"
            gh release upload "$name/v$version" "build/$name.mimic" --clobber
          done

      - name: Rebuild index.json
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: go run ./tools/reindex -o index.json

      - name: Commit index.json
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.json
          git commit -m "chore: reindex templates" || exit 0
          git push origin main
